name: CICD
on:
  push:
    branches: [vitepress]
  pull_request:
    branches: [vitepress]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: CI Command
        run: |
          set -ex 
          npm ci && npm run build
      - name: CD Command
        if: startsWith(github.event.head_commit.message, 'Merge pull request')
        env:
          CICD_TOKEN: ${{ secrets.CICD }}
        run: |
          set -ex

          git config user.name  "github action"
          git config user.email "hui.cheng@naturali.io"

          rm -rf /tmp/bethere-dist
          cp -a docs/.vitepress/dist /tmp/bethere-dist
          echo "bethere.ai" > /tmp/bethere-dist/CNAME

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -maxdepth 1 -not -path . -not -path ./.git -exec rm -rf {} \;
          cp -a /tmp/bethere-dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to deploy."
          else
            git commit -m 'deploy'
            git push origin gh-pages
          fi
